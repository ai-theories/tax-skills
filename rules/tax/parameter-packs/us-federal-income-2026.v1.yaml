# Year-adjusted US federal income tax parameters for 2026.
#
# Distinct from us-federal-investment-rules.v1, which holds structural rules
# that do not move with inflation. These figures DO move every year, so this
# pack covers exactly one tax year and a 2027 analysis must get its own pack.
#
# Reflects the One Big Beautiful Bill Act (July 2025), which made the 2017 rate
# schedule permanent and reset several thresholds. A pack that still modelled a
# 2025 sunset would be wrong.
schema_version: "1.0"
bundle_id: us-federal-income-2026.v1
jurisdiction: US_FEDERAL
tax_years: [2026]
status: reviewed
review:
  transcription_verified_by: "Claude (automated), 2026-10-05"
  transcription_verified_against: "Rev. Proc. 2025-32, https://www.irs.gov/pub/irs-drop/rp-25-32.pdf"
  methodology_reviewed_by: unassigned
  note: >
    Every figure below was read from Rev. Proc. 2025-32 directly and compared
    against this pack. Two errors were found and corrected on 2026-10-05: the
    head-of-household 24% bracket ceiling (had 201,775, correct 201,750, Table
    2) and the section 199A married-filing-separately threshold (had 201,750,
    correct 201,775, section 4.26). All other figures matched exactly.

    The AMT 50% phase-out rate is not stated as a rate in the revenue
    procedure; it is confirmed arithmetically by the published complete-phaseout
    amounts, which equal the threshold plus twice the exemption for every
    filing status.

    What this verification does NOT cover: whether the calculations built on
    these figures treat every fact pattern correctly. Transcription accuracy
    and methodology are separate claims, and only the first is signed off here.
knowledge_time: "2026-09-29T00:00:00Z"

