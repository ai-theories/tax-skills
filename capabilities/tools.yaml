# The MCP tool surface, server by server.
#
# `implemented` means a caller can invoke it through that server. An operation
# that runs only as a step inside a workflow template is `internal_operation`:
# real code, but not reachable from a tool call, so claiming it here would tell
# a host it can do something it cannot.
#
# Every implemented tool names the server that exposes it, and a test asserts
# each server's live tools/list matches this file exactly in both directions.
#
# No execute_trade or file_return tool exists in this release.
schema_version: '2.0'
servers:
- id: federal
  name: taxagent-federal
  needs_identity: false
  summary: US federal tax calculations over figures you supply.
- id: estate
  name: taxagent-estate
  needs_identity: false
  summary: Federal estate tax, gift exclusions and fiduciary income tax.
- id: international
  name: taxagent-international
  needs_identity: false
  summary: Foreign earned income exclusion and foreign gift reporting.
- id: business
  name: taxagent-business
  needs_identity: false
  summary: Section 179 expensing and C corporation versus pass-through.
- id: compliance
  name: taxagent-compliance
  needs_identity: false
  summary: Late filing and payment penalties, and the estimated tax safe harbour.
- id: muni
  name: taxagent-muni
  needs_identity: false
  summary: Municipal bond yields, market discount and premium amortization.
- id: salt
  name: taxagent-salt
  needs_identity: false
  summary: The federal cap on deducting state and local tax.
- id: portfolio
  name: taxagent-portfolio
  needs_identity: true
  summary: 'Account-scope lot analysis: gain and loss, wash-sale screening, loss-harvest scenarios.'
- id: household
  name: taxagent-household
  needs_identity: true
  summary: Household and UMA-sleeve coordination over one shared budget per tax unit.
