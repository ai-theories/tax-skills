# Blocked until a validated rebalancing engine is registered. The template
# exists so the skill can name the right workflow and receive an honest
# UNSUPPORTED_SCOPE, rather than being priced by the harvest selector.
id: account-rebalance.v1
mode: analysis_only
required_scope: account
steps:
  - id: snapshot
    operation: create_snapshot
  - id: lot_check
    operation: validate_lots
    requires: [snapshot]
  - id: constraints
    operation: compile_constraints
    requires: [lot_check]
  - id: rebalance
    operation: select_rebalance_trades
    requires: [constraints]
  - id: gain_loss
    operation: calculate_gain_loss
    requires: [rebalance]
  - id: wash_sale
    operation: screen_wash_sales
    requires: [gain_loss]
  - id: validation
    operation: validate_scenario
    requires: [wash_sale]
  - id: evidence
    operation: build_evidence_pack
    requires: [validation]
on_unsupported: blocked
on_infeasible: return_diagnostics
